name: Build and Release Antigravity APKs

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      vendor_url:
        description: 'Optional direct URL to download vendor inputs archive (core, certs, seed, shims)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Both Release Editions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Tools & System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner file zip unzip gzip

      - name: Prepare Vendor Inputs & Signing Keystore
        env:
          VENDOR_URL: ${{ inputs.vendor_url || secrets.VENDOR_DOWNLOAD_URL }}
        run: |
          mkdir -p tools
          
          # 1. Generate debug keystore if absent
          if [ ! -f "tools/debug.keystore" ]; then
            echo "[CI] Generating debug keystore..."
            keytool -genkey -v -keystore tools/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup Android API 28 android.jar if absent
          if [ ! -f "tools/android.jar" ]; then
            echo "[CI] Fetching android.jar (API 28)..."
            curl -fsSL -o tools/android.jar "https://github.com/patelakash007/Agy-cli-app/releases/download/v1.0.0/android.jar" || true
          fi

          # 3. Setup R8 / D8 compiler jar if absent
          if [ ! -f "tools/r8.jar" ]; then
            echo "[CI] Fetching r8.jar..."
            curl -fsSL -o tools/r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar"
          fi

          # 4. Handle optional external vendor archive override
          if [ -n "$VENDOR_URL" ]; then
            echo "[CI] Downloading vendor inputs from $VENDOR_URL..."
            mkdir -p vendor
            curl -fsSL -o vendor.tar.gz "$VENDOR_URL"
            tar -xzf vendor.tar.gz -C vendor
            export AGY_HOME="$PWD/vendor"
          fi

      - name: Build Standard Release APK (dist/antigravity.apk)
        run: |
          bash build.sh

      - name: Build Dev Debug APK (dist/antigravity-dev.apk)
        run: |
          bash build.sh --dev

      - name: Compute Cryptographic Checksums
        run: |
          cd dist
          sha256sum antigravity.apk antigravity-dev.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-binaries
          path: |
            dist/antigravity.apk
            dist/antigravity-dev.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ format('Antigravity for Android {0}', github.event.inputs.tag_name || github.ref_name) }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          files: |
            dist/antigravity.apk
            dist/antigravity-dev.apk
            dist/SHA256SUMS.txt
          body: |
            <div align="center">
              <h3>Antigravity for Android v1.0.0</h3>
              <p>Native Android Companion Host &bull; Official Google Native Bionic CLI &bull; Embedded Studio</p>
            </div>

            ---

            ### Packages & Distribution Artifacts

            | Package | Description |
            | :--- | :--- |
            | **`antigravity.apk`** | Standard production release with native Bionic engine (~356 KB) |
            | **`antigravity-dev.apk`** | Developer debuggable edition (`com.agy.dev`) (~356 KB) |
            | **`SHA256SUMS.txt`** | Cryptographic SHA-256 checksums for package integrity verification |

            ---

            ### Key Highlights in v1.0.0

            * **Built On-Device via AI Pair-Programming:** Architected and engineered on Android by **@patelakash007** pair-programming with **Google Antigravity CLI powered by Gemini 3.8 Flash High**.
            * **Official Native Bionic ARM64 Engine:** Runs Google's official Bionic CLI (`agy --remote-control`) natively within Android userspace at full CPU and I/O speeds.
            * **Embedded Google Remote Control Studio:** Renders Google's official Remote Control Web UI (`https://antigravity.google.com`) directly in an embedded, hardware-accelerated WebView with DOM persistence and file upload support.
            * **Foreground Process Supervisor:** `CoreServerService` with partial WakeLock keeps the agentic engine executing autonomously in the background even when screen is off.
            * **On-Demand Cryptographic Verification:** Fetches Google's official CLI binary on first launch with streaming SHA-512 cryptographic verification against Google's live manifest.
            * **Ultra-Lightweight Footprint (~356 KB):** Compiled via an autonomous Gradle-free shell pipeline with minimal footprint.
            * **Hardened Security Architecture:** Operates entirely within standard Android application sandboxing with zero root requirements and strict loopback binding.

            ---

            > [!TIP]
            > Verify package integrity before installation:
            > ```bash
            > sha256sum -c SHA256SUMS.txt
            > ```

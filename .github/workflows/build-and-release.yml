name: Build Development APK (publication refused)

# G02a/R20: nothing in this workflow publishes automatically. Push/tag/manual
# runs produce clearly-labelled development artifacts only; a public release
# requires an explicit manual confirmation plus the owner's release gates P1-P4.
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Type PUBLISH to create a public GitHub release (any other value only builds)'
        required: true
        default: 'no'
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: ''
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: true

# Least privilege for the build lane; the release job requests write access itself.
permissions:
  contents: read

jobs:
  build:
    name: Build Development Edition
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Android NDK (fail closed)
        run: |
          set -euo pipefail
          CLANG_REL="toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -x "$ANDROID_NDK_HOME/$CLANG_REL" ]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            NDK_DIR="$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
            if [ -z "$NDK_DIR" ]; then
              yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"
              NDK_DIR="$SDK_ROOT/ndk/27.0.12077973"
            fi
            test -x "$NDK_DIR/$CLANG_REL"
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK configured: ${ANDROID_NDK_HOME:-preinstalled}"

      - name: Install Android Build Tools & System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner file zip unzip gzip

      - name: Prepare Development Build Inputs
        run: |
          mkdir -p tools
          
          # 1. Generate debug keystore if absent
          if [ ! -f "tools/debug.keystore" ]; then
            echo "[CI] Generating debug keystore..."
            keytool -genkey -v -keystore tools/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup Android API 28 android.jar if absent
          if [ ! -f "tools/android.jar" ]; then
            echo "[CI] Fetching android.jar (API 28)..."
            curl -fsSL -o tools/android.jar "https://github.com/patelakash007/Agy-cli-app/releases/download/v1.0.0/android.jar" || true
          fi

          # 3. Setup R8 / D8 compiler jar if absent
          if [ ! -f "tools/r8.jar" ]; then
            echo "[CI] Fetching r8.jar..."
            curl -fsSL -o tools/r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar"
          fi


      - name: Host regression tests
        run: |
          bash tests/run_host_tests.sh

      # The release route intentionally refuses without owner-controlled signing
      # inputs (A04a/P3). CI builds the explicit development edition only; that is
      # a development artifact, never a release.
      - name: Build Development APK (dist/antigravity-dev.apk)
        run: |
          bash build.sh --dev

      - name: Compute Development Checksums
        run: |
          cd dist
          sha256sum antigravity-dev.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Development Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-development-binaries
          path: |
            dist/antigravity-dev.apk
            dist/SHA256SUMS.txt

  release:
    name: Publish approved release
    needs: build
    # Publication requires an explicit confirmation, a tag and the protected
    # release environment (owner approval). Tags alone never publish (G02a).
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_release == 'PUBLISH' &&
      inputs.tag_name != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download Development Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: antigravity-development-binaries
          path: dist

      - name: Refuse unpublished release gates
        run: |
          echo "[G02a] Release publication is blocked until P1-P4 and device evidence are approved."
          echo "[G02a] No automatic publication is performed by this workflow."
          exit 1

      - name: Publish GitHub Release
        if: false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ format('Antigravity for Android {0}', inputs.tag_name) }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: false
          files: |
            dist/antigravity-dev.apk
            dist/SHA256SUMS.txt
          body: |
            > [!IMPORTANT]
            > Unofficial Android host for Google's Antigravity CLI. This project is not a
            > Google product and is not endorsed by Google.

            Development build only. This workflow refuses publication; no release, device
            verification, signing approval, or vendor redistribution permission exists yet.

            What the current development build contains:
            * A Java host app, foreground CLI supervisor and embedded WebView surface.
            * An explicit-install download of Google's Android ARM64 CLI from the vendor
              manifest, with SHA-512 verification and atomic publication.
            * No native Bash/tools/package manager, terminal, file editor, package UI or
              local agent protocol client.

            Not measured or approved: installed/download size, memory, CPU, battery, the
            supported device matrix, the release signing identity, and vendor terms.
